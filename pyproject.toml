[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "election-forecast"
version = "0.31.0.dev0"
description = "Point-in-time Korean presidential election forecasting engine; active V31 with a multiplicative regional dispersion expansion."
readme = "README.md"
authors = [
    { name = "Election Forecast contributors", email = "bamboosalt09-bam@users.noreply.github.com" },
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["election", "forecasting", "point-in-time", "reproducibility", "korea"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "httpx>=0.25",
    "python-dateutil>=2.8",
    "tenacity>=8.2",
    "tqdm>=4.66",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "pypdf>=6.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
reproduce-v31 = [
    "numpy==2.4.6",
    "pandas==3.0.5",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
]
viz = ["matplotlib>=3.8", "shapely>=2.0"]

[project.urls]
Homepage = "https://github.com/bamboosalt09-bam/election-forecast"
Repository = "https://github.com/bamboosalt09-bam/election-forecast"
Issues = "https://github.com/bamboosalt09-bam/election-forecast/issues"
Security = "https://github.com/bamboosalt09-bam/election-forecast/security/policy"

[project.scripts]
election-forecast = "election_forecast.cli:main"
news-analyzer = "news_analyzer.cli:main"
news-collector = "news_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
election_forecast = ["_v31_runtime.zip"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
