name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Verify tracked-file and frozen-baseline boundary
        run: python scripts/audit_github_baseline.py
      - name: Verify current public pointers and package version
        run: python scripts/audit_current_public_surface.py

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run regression suite
        run: python -m pytest -q

  active-v27-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Audit frozen active model
        run: python scripts/audit_public_active_presidential_model_v27.py

  v27-clean-reproduction:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,reproduce-v27]"
      - name: Reproduce V27 in an isolated output directory
        run: python scripts/verify_v27_clean_reproduction.py

  public-data-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Audit redistributable data boundary
        run: python scripts/audit_public_data_rights.py
      - name: Audit publication security controls
        run: python scripts/audit_publication_security.py

  v27-wheel-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and audit the public distributions
        run: |
          python -m pip install build
          python -m build
          python scripts/audit_distribution_artifacts.py --dist-dir dist
          mkdir -p dist/from-sdist
          python -m pip wheel dist/*.tar.gz --no-deps --wheel-dir dist/from-sdist
      - name: Install the sdist-built wheel outside the checkout and audit V27
        run: |
          python -m venv "$RUNNER_TEMP/v27-wheel-audit"
          "$RUNNER_TEMP/v27-wheel-audit/bin/python" -m pip install dist/from-sdist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/v27-wheel-audit/bin/election-forecast" audit-current-presidential
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: election-forecast-v27-wheel
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  v27-wheel-reproduction:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build and install the standalone wheel
        shell: pwsh
        run: |
          python -m pip install build
          python -m build --wheel
          $wheel = Get-ChildItem dist -Filter *.whl | Select-Object -First 1 -ExpandProperty FullName
          python -m venv "$env:RUNNER_TEMP\v27-wheel-reproduction"
          & "$env:RUNNER_TEMP\v27-wheel-reproduction\Scripts\python.exe" -m pip install "$wheel[reproduce-v27]"
      - name: Reproduce and compare from outside the checkout
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          try {
            & "$env:RUNNER_TEMP\v27-wheel-reproduction\Scripts\election-forecast.exe" verify-current-presidential
          } finally {
            Pop-Location
          }

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Audit the exact V27 dependency lock
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-v27.lock --strict --progress-spinner off
