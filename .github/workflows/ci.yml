# Job names are deliberately version-neutral. Branch protection pins required
# checks by name, so a job called v28-clean-reproduction has to be renamed at
# every promotion - and the protection rule updated in lockstep, or main blocks
# on a check that will never report again. That is exactly what happened when
# these were renamed from v28 to v29.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify tracked-file and frozen-baseline boundary
        run: python scripts/audit_github_baseline.py
      - name: Verify current public pointers and package version
        run: python scripts/audit_current_public_surface.py
      - name: Verify every version declaration agrees with the pointer
        run: python scripts/audit_version_consistency.py
      - name: Verify the document index matches the tree
        run: python scripts/build_docs_index.py --check

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run regression suite
        run: python -m pytest -q

  active-model-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Audit frozen active model
        run: python scripts/audit_public_active_presidential_model_v31.py

  clean-reproduction:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,reproduce-v31]"
      - name: Reproduce V31 in an isolated output directory
        run: python scripts/verify_v31_clean_reproduction.py

  prospective-reproduction:
    # The published 2025 forecast had no CI job, so it went unreproducible the
    # moment the V28 boundary was enforced and stayed that way while eight
    # other jobs reported green. This one runs the forecast the project ships.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Reproduce the frozen 2025 demonstration
        run: python scripts/verify_v31_prospective_reproduction.py

  public-data-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Audit redistributable data boundary
        run: python scripts/audit_public_data_rights.py
      - name: Audit publication security controls
        run: python scripts/audit_publication_security.py

  wheel-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and audit the public distributions
        run: |
          python -m pip install build
          python -m build
          python scripts/audit_distribution_artifacts.py --dist-dir dist
          mkdir -p dist/from-sdist
          python -m pip wheel dist/*.tar.gz --no-deps --wheel-dir dist/from-sdist
      - name: Install the sdist-built wheel outside the checkout and audit V31
        run: |
          python -m venv "$RUNNER_TEMP/v31-wheel-audit"
          "$RUNNER_TEMP/v31-wheel-audit/bin/python" -m pip install dist/from-sdist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/v31-wheel-audit/bin/election-forecast" audit-current-presidential
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: election-forecast-v31-wheel
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  wheel-reproduction:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Build and install the standalone wheel
        shell: pwsh
        run: |
          python -m pip install build
          python -m build --wheel
          $wheel = Get-ChildItem dist -Filter *.whl | Select-Object -First 1 -ExpandProperty FullName
          python -m venv "$env:RUNNER_TEMP\v31-wheel-reproduction"
          & "$env:RUNNER_TEMP\v31-wheel-reproduction\Scripts\python.exe" -m pip install "$wheel[reproduce-v31]"
      - name: Reproduce and compare from outside the checkout
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          try {
            & "$env:RUNNER_TEMP\v31-wheel-reproduction\Scripts\election-forecast.exe" verify-current-presidential
          } finally {
            Pop-Location
          }

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Audit the exact V31 dependency lock
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-v31.lock --strict --progress-spinner off
